<div class="gallery">
  <h1 class="title">Galería</h1>

  @if (error()) {
    <p class="error-msg">{{ error() }}</p>
  }

  <!-- Botón subir imagen — solo admin/CEO -->
  @if (esAdmin) {
    <div class="admin-actions">
      <input type="file" accept="image/*" (change)="seleccionarArchivo($event)" hidden #fileInput>
      <button class="btn-subir" (click)="fileInput.click()"> Subir imagen</button>
    </div>
  }

  <div class="grid">
    @for (imagen of imagenes(); track imagen.id) {
      <div class="grid-item" (click)="openImage(imagen.src)">

        <img [src]="imagen.src" [alt]="imagen.alt" (error)="handleImageError($event)">

        @if (imagen.empleadoId !== null) {
          <button class="btn-tatuador" (click)="verTatuador(imagen.empleadoId, $event)">
            Conoce al tatuador
          </button>
        }

        @if (esAdmin) {
          <button class="btn-eliminar" (click)="eliminarImagen(imagen, $event)">✕</button>
        }

      </div>
    }
  </div>

  <!-- Visor de imagen ampliada -->
  @if (selectedImage(); as src) {
    <div class="image-viewer" (click)="closeImage()">
      <img [src]="src" alt="Imagen ampliada">
    </div>
  }
</div>

<!-- MODAL: Vincular imagen a tatuador  (solo admin/CEO) -->
@if (mostrarModalSubida()) {
  <div class="modal-overlay" (click)="cerrarModalSubida()"></div>

  <div class="modal-subida">

    <div class="modal-header">
      <h3>Subir imagen a la galería</h3>
      <button class="modal-close" (click)="cerrarModalSubida()">✕</button>
    </div>

    <div class="modal-body">

      @if (previewTemporal()) {
        <div class="img-preview">
          <img [src]="previewTemporal()" alt="Preview">
        </div>
      }

      <label>Nombre de la imagen</label>
      <input type="text" [(ngModel)]="nombreImagenTemp" placeholder="Ej: Dragón rojo">

      <label>Vincular a tatuador</label>
      <select [(ngModel)]="tatuadorSeleccionado">
        @for (t of tatuadores(); track t.id) {
          <option [ngValue]="t.id">{{ t.nombre }} — {{ t.especialidad }}</option>
        }
      </select>

    </div>

    <div class="modal-footer">
      <button class="btn-cancelar" (click)="cerrarModalSubida()">Cancelar</button>
      <button class="btn-confirmar" [disabled]="subiendo()" (click)="confirmarSubida()">
        {{ subiendo() ? 'Subiendo...' : 'Subir imagen' }}
      </button>
    </div>

  </div>
}
